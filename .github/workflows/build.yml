name: Build and package
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Package project
        run: |
          zip -r pitchside-production.zip . -x ".git/*" ".next/*" "node_modules/*" "*.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pitchside-production
          path: pitchside-production.zip
